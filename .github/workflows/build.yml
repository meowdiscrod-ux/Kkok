          package prestige.util;

          /** Frame-time based easing. Shared dt so every widget animates at the same speed. */
          public final class Anim {
              private Anim() {}
              public static float open = 0f;   // GUI fade 0..1
              public static float speed = 1f;  // set from Client Settings
              private static long last = System.nanoTime();
              private static float dt = 0.016f;

              public static float dt() {
                  long now = System.nanoTime();
                  if (now - last > 2_000_000L) {
                      dt = Math.min(0.1f, (now - last) / 1_000_000_000f);
                      last = now;
                  }
                  return dt;
              }

              public static float approach(float cur, float target, float rate) {
                  float k = 1f - (float) Math.exp(-rate * speed * dt());
                  return cur + (target - cur) * k;
              }
          }
          PRESTIGE_EOF
