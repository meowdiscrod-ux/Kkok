          /** Custom-painted widgets. They extend vanilla widgets, so touch, drag and mouse input work everywhere. */
          public final class Widgets {
              private Widgets() {}

              private static int a(int color) { return Gfx.alpha(color, Anim.open); }

              private static void card(DrawContext ctx, int x, int y, int w, int h, float hover, float sel) {
                  int bg = Gfx.lerp(Theme.CARD, Theme.CARD_HOVER, hover);
                  bg = Gfx.lerp(bg, Theme.CARD_SEL, sel);
                  Gfx.round(ctx, x, y, w, h, 4, a(bg));
                  if (sel > 0.01f) ctx.fill(x, y + 4, x + 2, y + h - 4, Gfx.alpha(Theme.accent(), Anim.open * sel));
              }

              private static int ty(int y, int h) { return y + (h - 8) / 2; }

              public static class TextButton extends ButtonWidget {
