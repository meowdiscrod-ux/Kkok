          package prestige.modules.combat;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.entity.LivingEntity;
          import prestige.core.*;
          import prestige.util.Gfx;
          import prestige.util.Targets;

          import java.util.List;
          import java.util.Locale;

          /** Read-only: shows distance to the nearest target and whether it is inside the reach you set. Does NOT extend reach. */
          public class ReachVisualizer extends ClientModule {
              private final NumberSetting reach = add(new NumberSetting("Weapon Reach", 3.0, 2.0, 6.0, 0.1));
              private LivingEntity target;
              private double dist;

              public ReachVisualizer() {
                  super("Reach Visualizer", "Read-only distance readout vs your weapon's reach.", Category.COMBAT);
              }

              @Override
              public void onFrame(MinecraftClient mc) {
                  if (mc.player == null) { target = null; return; }
                  LivingEntity t = Targets.crosshair(mc);
                  if (t == null) t = Targets.nearestVisible(mc, 8.0);
                  target = t;
                  if (t != null) dist = Targets.hitboxDistance(mc.player, t);
              }

              @Override
              public void addInfo(List<Line> out) {
                  if (target == null) { out.add(new Line("Reach: no target", Theme.MUTED)); return; }
                  boolean in = dist <= reach.get();
                  out.add(new Line(String.format(Locale.ROOT, "Reach %.2f / %.2fm", dist, reach.get()), in ? Theme.GREEN : Theme.RED_T));
              }

              @Override
              public void renderHud(DrawContext ctx, MinecraftClient mc) {
                  if (target == null) return;
                  int cx = ctx.getScaledWindowWidth() / 2, cy = ctx.getScaledWindowHeight() / 2;
                  int w = 60, x = cx - w / 2, y = cy + 14;
                  double scale = reach.get() * 1.5;
                  ctx.fill(x, y, x + w, y + 3, 0x90101018);
                  int fill = (int) Math.min(w, w * dist / scale);
                  ctx.fill(x, y, x + fill, y + 3, dist <= reach.get() ? Theme.GREEN : Theme.RED_T);
                  int mark = (int) (w * reach.get() / scale);
                  ctx.fill(x + mark, y - 2, x + mark + 1, y + 5, 0xFFFFFFFF);
              }
          }
