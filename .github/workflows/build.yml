          cat > 'src/main/java/prestige/util/Gfx.java' <<'PRESTIGE_EOF'
          package prestige.util;

          import net.minecraft.client.gui.DrawContext;
          import prestige.core.Theme;

          public final class Gfx {
              private Gfx() {}

              public static int alpha(int c, float a) {
                  a = Math.max(0f, Math.min(1f, a));
                  int al = Math.round(((c >>> 24) & 0xFF) * a);
                  return (al << 24) | (c & 0xFFFFFF);
              }

              public static int lerp(int a, int b, float t) {
                  t = Math.max(0f, Math.min(1f, t));
                  int aa = (int) (((a >>> 24) & 255) + (((b >>> 24) & 255) - ((a >>> 24) & 255)) * t);
                  int ar = (int) (((a >> 16) & 255) + (((b >> 16) & 255) - ((a >> 16) & 255)) * t);
                  int ag = (int) (((a >> 8) & 255) + (((b >> 8) & 255) - ((a >> 8) & 255)) * t);
                  int ab = (int) ((a & 255) + ((b & 255) - (a & 255)) * t);
                  return (aa << 24) | (ar << 16) | (ag << 8) | ab;
              }

              /** Rounded rectangle from plain fills (cheap, works everywhere). */
              public static void round(DrawContext ctx, int x, int y, int w, int h, int r, int color) {
                  r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
                  if (r == 0) { ctx.fill(x, y, x + w, y + h, color); return; }
                  ctx.fill(x, y + r, x + w, y + h - r, color);
                  for (int i = 0; i < r; i++) {
                      double dy = r - i - 0.5;
                      int inset = r - (int) Math.round(Math.sqrt(r * r - dy * dy));
                      ctx.fill(x + inset, y + i, x + w - inset, y + i + 1, color);
                      ctx.fill(x + inset, y + h - i - 1, x + w - inset, y + h - i, color);
                  }
              }

              public static void text(DrawContext ctx, String s, int x, int y, int color) {
                  ctx.drawText(Mc.tr(), s, x, y, color, false);
              }

              public static void textShadow(DrawContext ctx, String s, int x, int y, int color) {
                  ctx.drawText(Mc.tr(), s, x, y, color, true);
              }

              public static int width(String s) { return Mc.tr().getWidth(s); }

              public static void gradientText(DrawContext ctx, String s, int x, int y, float a) {
                  int cx = x;
                  for (int i = 0; i < s.length(); i++) {
                      String ch = String.valueOf(s.charAt(i));
                      float t = s.length() <= 1 ? 0f : i / (float) (s.length() - 1);
                      text(ctx, ch, cx, y, alpha(Theme.at(t), a));
                      cx += width(ch);
                  }
              }

              public static void toggle(DrawContext ctx, int x, int y, float anim, float alphaMul) {
                  int track = lerp(Theme.OFF, Theme.accent(), anim);
                  round(ctx, x, y, 24, 12, 6, alpha(track, alphaMul));
                  round(ctx, x + 2 + Math.round(anim * 12), y + 2, 8, 8, 4, alpha(0xFFFFFFFF, alphaMul));
              }
          }
