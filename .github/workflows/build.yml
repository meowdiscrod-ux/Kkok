name: Build Prestige

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Write project files
        run: |
          mkdir -p "$(dirname 'README.md')"
          cat > 'README.md' <<'PRESTIGE_EOF'
          # Prestige Client (Fabric 1.21.11)

          Click GUI client: dark grey UI, purple + red accents, animated switches, sliders, dropdowns, search, keybinds, autosave.

          ## Install
          1. Install Fabric Loader 0.18.1+ for Minecraft 1.21.11 and **Fabric API** (0.141.x for 1.21.11).
          2. Put `prestige-client-1.0.0.jar` in your `mods` folder.
          3. Java 21 required.

          ## Build with GitHub
          Upload this folder to a repo (so `build.gradle` and `src/` are at the top level). The workflow in `.github/workflows/build.yml` builds it:
          **Actions tab -> latest run -> Artifacts -> prestige-client**.

          ## Open the menu
          - PC: **Right Shift** (rebind in Controls)
          - Phone/tablet: tap the **Prestige** button on the title screen or pause menu

          ## Android (MJ Launcher / Pojav-based launchers)
          Pick a Java 21 runtime, install Fabric Loader + Fabric API. The GUI uses only plain fills and text (no blur, no shaders) and only touch-friendly widgets. Keybinding and search typing need an on-screen/physical keyboard.

          ## Modules
          - Combat (read-only trainers, they never attack, aim, click, swap items or send packets): Mace Combo Timer, Reach Visualizer, Slam Timing Assistant, Reaction Trainer, Aim Trainer
          - Movement: Sprint, Safe Walk (auto-sneak at ledges), Movement HUD
          - Render: FPS Display, CPS Display, Keystrokes, Armor HUD, Target HUD
          - Misc: Client Settings, Notifications, Module Manager

          Settings save to `config/prestige.json`.

          ## Dependencies
          Minecraft 1.21.11, Fabric Loader >= 0.18.1, Fabric API 0.141.x, Java 21. Build: Gradle 9.2.1, Fabric Loom 1.14.
          PRESTIGE_EOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'PRESTIGE_EOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'PRESTIGE_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          fabric_version=0.141.3+1.21.11

          mod_version=1.0.0
          maven_group=prestige
          archives_base_name=prestige-client
          PRESTIGE_EOF
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'PRESTIGE_EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/PrestigeClient.java')"
          cat > 'src/main/java/prestige/PrestigeClient.java' <<'PRESTIGE_EOF'
          package prestige;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.Screens;
          import net.minecraft.client.gui.screen.GameMenuScreen;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;
          import prestige.core.ConfigManager;
          import prestige.core.Modules;
          import prestige.core.Theme;
          import prestige.gui.ClickGuiScreen;
          import prestige.gui.Widgets;
          import prestige.util.Anim;
          import prestige.util.Mc;

          public class PrestigeClient implements ClientModInitializer {
              public static KeyBinding menuKey;
              private static final KeyBinding.Category CATEGORY = KeyBinding.Category.create(Identifier.of("prestige", "main"));

              @Override
              public void onInitializeClient() {
                  Modules.init();
                  ConfigManager.load();

                  // PC: Right Shift opens/closes the Click GUI (rebindable in Controls).
                  menuKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.prestige.menu", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT, CATEGORY));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (menuKey.wasPressed()) {
                          if (client.currentScreen == null) client.setScreen(new ClickGuiScreen(null));
                      }
                      Modules.tick(client);
                  });

                  // HUD (new Fabric HUD API)
                  HudElementRegistry.addLast(Identifier.of("prestige", "hud"), (ctx, tickCounter) -> {
                      net.minecraft.client.MinecraftClient mc = Mc.get();
                      Anim.dt();
                      if (mc.player == null || mc.options.hudHidden) return;
                      Modules.frame(mc);
                      Modules.renderHud(ctx, mc);
                  });

                  ClientLifecycleEvents.CLIENT_STOPPING.register(client -> ConfigManager.saveNow());

                  // Phone/tablet: a "Prestige" button on the title and pause screens (no keyboard needed).
                  ScreenEvents.AFTER_INIT.register((client, screen, w, h) -> {
                      if (screen instanceof GameMenuScreen || screen instanceof TitleScreen) {
                          Screens.getButtons(screen).add(new Widgets.TextButton(6, 6, 60, 18, "Prestige", Theme.PURPLE,
                                  () -> client.setScreen(new ClickGuiScreen(screen))));
                      }
                  });
              }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/BoolSetting.java')"
          cat > 'src/main/java/prestige/core/BoolSetting.java' <<'PRESTIGE_EOF'
          package prestige.core;

          public class BoolSetting extends Setting {
              private boolean v;
              public BoolSetting(String name, boolean def) { super(name); this.v = def; }
              public boolean get() { return v; }
              public void set(boolean b) { if (v != b) { v = b; ConfigManager.dirty(); } }
              @Override public Object save() { return v; }
              @Override public void load(Object o) { if (o instanceof Boolean b) v = b; }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/Category.java')"
          cat > 'src/main/java/prestige/core/Category.java' <<'PRESTIGE_EOF'
          package prestige.core;

          public enum Category {
              COMBAT("Combat"), MOVEMENT("Movement"), RENDER("Render"), MISC("Misc");
              public final String label;
              Category(String label) { this.label = label; }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/ClientModule.java')"
          cat > 'src/main/java/prestige/core/ClientModule.java' <<'PRESTIGE_EOF'
          package prestige.core;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import prestige.util.Mc;

          import java.util.ArrayList;
          import java.util.List;

          public abstract class ClientModule {
              public final String name, description;
              public final Category category;
              public boolean enabled;
              public boolean alwaysOn;
              public int key = -1;          // GLFW key code, -1 = unbound
              public boolean keyDown;       // internal edge detection for keybinds
              public float anim;            // GUI switch animation
              public final List<Setting> settings = new ArrayList<>();

              protected ClientModule(String name, String description, Category category) {
                  this.name = name; this.description = description; this.category = category;
              }

              protected <T extends Setting> T add(T s) { settings.add(s); return s; }
              protected MinecraftClient mc() { return Mc.get(); }

              /** User toggle (GUI or keybind): shows a notification. */
              public void toggle() {
                  if (alwaysOn) return;
                  setEnabled(!enabled);
                  Notifications.toggled(this);
              }

              /** Silent enable/disable (used when loading config). */
              public void setEnabled(boolean v) {
                  if (alwaysOn) v = true;
                  if (v == enabled) return;
                  enabled = v;
                  if (v) onEnable(); else onDisable();
                  ConfigManager.dirty();
              }

              public void onEnable() {}
              public void onDisable() {}
              public void onTick(MinecraftClient mc) {}
              public void onFrame(MinecraftClient mc) {}
              public void addInfo(List<Line> out) {}
              public void renderHud(DrawContext ctx, MinecraftClient mc) {}
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/ConfigManager.java')"
          cat > 'src/main/java/prestige/core/ConfigManager.java' <<'PRESTIGE_EOF'
          package prestige.core;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.LinkedHashMap;
          import java.util.Map;

          /** Autosaves to config/prestige.json (debounced, so dragging a slider does not spam the disk). */
          public final class ConfigManager {
              private ConfigManager() {}

              private static class ModuleData {
                  boolean enabled;
                  int key = -1;
                  Map<String, Object> settings = new LinkedHashMap<>();
              }

              private static class Data {
                  Map<String, ModuleData> modules = new LinkedHashMap<>();
              }

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static boolean dirty, loading;
              private static long dirtyAt;

              private static Path path() { return FabricLoader.getInstance().getConfigDir().resolve("prestige.json"); }

              public static void dirty() {
                  if (loading) return;
                  dirty = true;
                  dirtyAt = System.currentTimeMillis();
              }

              public static void tick() {
                  if (dirty && System.currentTimeMillis() - dirtyAt > 1500) saveNow();
              }

              public static void load() {
                  loading = true;
                  try {
                      if (Files.exists(path())) {
                          Data d;
                          try (Reader r = Files.newBufferedReader(path())) { d = GSON.fromJson(r, Data.class); }
                          if (d != null && d.modules != null) {
                              for (ClientModule m : Modules.ALL) {
                                  ModuleData md = d.modules.get(m.name);
                                  if (md == null) continue;
                                  m.key = md.key;
                                  if (md.settings != null) {
                                      for (Setting s : m.settings) {
                                          Object v = md.settings.get(s.name);
                                          if (v != null) s.load(v);
                                      }
                                  }
                                  m.setEnabled(md.enabled);
                              }
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      loading = false;
                  }
              }

              public static void saveNow() {
                  dirty = false;
                  try {
                      Data d = new Data();
                      for (ClientModule m : Modules.ALL) {
                          ModuleData md = new ModuleData();
                          md.enabled = m.enabled;
                          md.key = m.key;
                          for (Setting s : m.settings) md.settings.put(s.name, s.save());
                          d.modules.put(m.name, md);
                      }
                      Files.createDirectories(path().getParent());
                      try (Writer w = Files.newBufferedWriter(path())) { GSON.toJson(d, w); }
                  } catch (Exception ignored) {
                  }
              }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/Line.java')"
          cat > 'src/main/java/prestige/core/Line.java' <<'PRESTIGE_EOF'
          package prestige.core;

          public record Line(String text, int color) {}
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/ModeSetting.java')"
          cat > 'src/main/java/prestige/core/ModeSetting.java' <<'PRESTIGE_EOF'
          package prestige.core;

          public class ModeSetting extends Setting {
              public final String[] options;
              private int index;

              public ModeSetting(String name, int def, String... options) {
                  super(name);
                  this.options = options;
                  this.index = Math.max(0, Math.min(def, options.length - 1));
              }

              public int index() { return index; }
              public String get() { return options[index]; }
              public boolean is(String s) { return options[index].equals(s); }
              public void set(int i) { if (i >= 0 && i < options.length && i != index) { index = i; ConfigManager.dirty(); } }

              @Override public Object save() { return options[index]; }
              @Override public void load(Object o) {
                  if (o instanceof String s) for (int i = 0; i < options.length; i++) if (options[i].equals(s)) index = i;
              }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/Modules.java')"
          cat > 'src/main/java/prestige/core/Modules.java' <<'PRESTIGE_EOF'
          package prestige.core;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import org.lwjgl.glfw.GLFW;
          import prestige.modules.combat.*;
          import prestige.modules.misc.*;
          import prestige.modules.movement.*;
          import prestige.modules.render.*;
          import prestige.util.ClickTracker;
          import prestige.util.FallTracker;
          import prestige.util.Gfx;

          import java.util.ArrayList;
          import java.util.List;

          public final class Modules {
              private Modules() {}
              public static final List<ClientModule> ALL = new ArrayList<>();

              public static void init() {
                  // Combat (read-only trainers)
                  ALL.add(new MaceComboTrainer());
                  ALL.add(new ReachVisualizer());
                  ALL.add(new SlamTimingAssistant());
                  ALL.add(new ReactionTrainer());
                  ALL.add(new AimTrainer());
                  // Movement
                  ALL.add(new Sprint());
                  ALL.add(new SafeWalk());
                  ALL.add(new MovementHud());
                  // Render
                  ALL.add(new FpsDisplay());
                  ALL.add(new CpsDisplay());
                  ALL.add(new Keystrokes());
                  ALL.add(new ArmorHud());
                  ALL.add(new TargetHud());
                  // Misc
                  ALL.add(new ClientSettings());
                  ALL.add(new NotificationsModule());
                  ALL.add(new ModuleManagerModule());
              }

              @SuppressWarnings("unchecked")
              public static <T extends ClientModule> T get(Class<T> c) {
                  for (ClientModule m : ALL) if (c.isInstance(m)) return (T) m;
                  return null;
              }

              public static void tick(MinecraftClient mc) {
                  FallTracker.tick(mc);
                  ConfigManager.tick();
                  long h = mc.getWindow().getHandle();
                  for (ClientModule m : ALL) {
                      if (m.key >= 0) {
                          boolean down = GLFW.glfwGetKey(h, m.key) == GLFW.GLFW_PRESS;
                          if (down && !m.keyDown && mc.currentScreen == null && mc.player != null) m.toggle();
                          m.keyDown = down;
                      }
                      if (m.enabled) m.onTick(mc);
                  }
              }

              public static void frame(MinecraftClient mc) {
                  ClickTracker.update(mc);
                  for (ClientModule m : ALL) if (m.enabled) m.onFrame(mc);
              }

              public static void renderHud(DrawContext ctx, MinecraftClient mc) {
                  List<Line> lines = new ArrayList<>();
                  for (ClientModule m : ALL) if (m.enabled) m.addInfo(lines);
                  if (!lines.isEmpty()) drawInfo(ctx, lines);
                  for (ClientModule m : ALL) if (m.enabled) m.renderHud(ctx, mc);
              }

              private static void drawInfo(DrawContext ctx, List<Line> lines) {
                  int maxW = 0;
                  for (Line l : lines) maxW = Math.max(maxW, Gfx.width(l.text()));
                  int x = 4, y = 4, w = maxW + 12, h = lines.size() * 10 + 6;
                  Gfx.round(ctx, x, y, w, h, 4, 0xA00A0A0F);
                  ctx.fill(x, y + 3, x + 2, y + h - 3, Theme.accent());
                  int ty = y + 4;
                  for (Line l : lines) {
                      Gfx.text(ctx, l.text(), x + 8, ty, l.color());
                      ty += 10;
                  }
              }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/Notifications.java')"
          cat > 'src/main/java/prestige/core/Notifications.java' <<'PRESTIGE_EOF'
          package prestige.core;

          import net.minecraft.client.gui.DrawContext;
          import prestige.modules.misc.NotificationsModule;
          import prestige.util.Anim;
          import prestige.util.Gfx;

          import java.util.ArrayDeque;

          public final class Notifications {
              private Notifications() {}

              private record Toast(String text, int color, long start) {}
              private static final ArrayDeque<Toast> TOASTS = new ArrayDeque<>();

              public static void push(String text, int color) {
                  if (!NotificationsModule.active()) return;
                  TOASTS.addLast(new Toast(text, color, System.currentTimeMillis()));
                  while (TOASTS.size() > 4) TOASTS.removeFirst();
              }

              public static void toggled(ClientModule m) {
                  push(m.name + (m.enabled ? " enabled" : " disabled"), m.enabled ? Theme.GREEN : Theme.RED_T);
              }

              public static void render(DrawContext ctx, float lifeSeconds) {
                  long now = System.currentTimeMillis();
                  TOASTS.removeIf(t -> (now - t.start()) / 1000f > lifeSeconds);
                  int w = ctx.getScaledWindowWidth();
                  int i = 0;
                  for (Toast t : TOASTS) {
                      float age = (now - t.start()) / 1000f;
                      float a = Math.min(1f, Math.min(age / 0.15f, (lifeSeconds - age) / 0.3f));
                      if (a <= 0f) continue;
                      int tw = Gfx.width(t.text()) + 18;
                      int x = (w - tw) / 2;
                      int y = 6 + i * 20 + Math.round((1f - Math.min(1f, age / 0.2f)) * -10f);
                      Gfx.round(ctx, x, y, tw, 16, 4, Gfx.alpha(0xE00A0A0F, a));
                      ctx.fill(x, y + 3, x + 2, y + 13, Gfx.alpha(t.color(), a));
                      Gfx.text(ctx, t.text(), x + 9, y + 4, Gfx.alpha(Theme.TEXT, a));
                      i++;
                  }
              }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/NumberSetting.java')"
          cat > 'src/main/java/prestige/core/NumberSetting.java' <<'PRESTIGE_EOF'
          package prestige.core;

          import java.util.Locale;

          public class NumberSetting extends Setting {
              public final double min, max, step;
              private double v;

              public NumberSetting(String name, double def, double min, double max, double step) {
                  super(name);
                  this.min = min; this.max = max; this.step = step; this.v = def;
              }

              public double get() { return v; }

              public void set(double d) {
                  d = Math.max(min, Math.min(max, d));
                  if (step > 0) d = Math.round((d - min) / step) * step + min;
                  d = Math.max(min, Math.min(max, d));
                  if (d != v) { v = d; ConfigManager.dirty(); }
              }

              public double normalized() { return (v - min) / (max - min); }
              public void setNormalized(double n) { set(min + n * (max - min)); }

              public String format() {
                  if (step >= 1) return String.valueOf((int) Math.round(v));
                  return String.format(Locale.ROOT, step >= 0.1 ? "%.1f" : "%.2f", v);
              }

              @Override public Object save() { return v; }
              @Override public void load(Object o) { if (o instanceof Number n) set(n.doubleValue()); }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/Setting.java')"
          cat > 'src/main/java/prestige/core/Setting.java' <<'PRESTIGE_EOF'
          package prestige.core;

          public abstract class Setting {
              public final String name;
              protected Setting(String name) { this.name = name; }
              public abstract Object save();
              public abstract void load(Object o);
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/core/Theme.java')"
          cat > 'src/main/java/prestige/core/Theme.java' <<'PRESTIGE_EOF'
          package prestige.core;

          import prestige.util.Gfx;

          public final class Theme {
              private Theme() {}
              public static final int BG = 0xF00A0A0F, PANEL = 0xFF111118, CARD = 0xFF17171F, CARD_HOVER = 0xFF1F1F2A,
                      CARD_SEL = 0xFF2A1F44, TEXT = 0xFFEDEDF5, MUTED = 0xFF8A8A9E, OFF = 0xFF3A3A48,
                      PURPLE = 0xFF8B5CF6, RED = 0xFFEF4444, GREEN = 0xFF4ADE80, YELLOW = 0xFFFACC15, RED_T = 0xFFF87171;

              /** 0 = purple, 1 = red, 2 = purple to red. */
              public static int mode = 2;

              public static int accent() { return mode == 1 ? RED : PURPLE; }
              public static int accent2() { return mode == 0 ? PURPLE : RED; }
              public static int at(float t) { return Gfx.lerp(accent(), accent2(), t); }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/gui/ClickGuiScreen.java')"
          cat > 'src/main/java/prestige/gui/ClickGuiScreen.java' <<'PRESTIGE_EOF'
          package prestige.gui;

          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;
          import prestige.PrestigeClient;
          import prestige.core.*;
          import prestige.util.Anim;
          import prestige.util.Gfx;
          import prestige.util.Mc;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class ClickGuiScreen extends Screen {
              private static Category category = Category.COMBAT;
              private static ClientModule selected;
              private static String query = "";

              private final Screen parent;
              private int x0, y0, W, H, sideW, midW, midX, setX, setW, hidden;
              private TextFieldWidget search;
              private boolean needsRebuild, firstPoll = true, prevClose;
              private ClientModule listening;
              private int listenFrames;
              private ModeSetting openMode;

              public ClickGuiScreen(Screen parent) {
                  super(Text.literal("Prestige"));
                  this.parent = parent;
                  Anim.open = 0f;
              }

              private List<ClientModule> visible() {
                  List<ClientModule> out = new ArrayList<>();
                  String q = query.trim().toLowerCase(Locale.ROOT);
                  for (ClientModule m : Modules.ALL) {
                      if (q.isEmpty() ? m.category == category : m.name.toLowerCase(Locale.ROOT).contains(q)) out.add(m);
                  }
                  return out;
              }

              @Override
              protected void init() {
                  W = Math.min(width - 8, 380);
                  H = Math.min(height - 8, 236);
                  x0 = (width - W) / 2;
                  y0 = (height - H) / 2;
                  sideW = 66;
                  midW = (int) ((W - sideW) * 0.46f);
                  midX = x0 + sideW;
                  setX = midX + midW;
                  setW = W - sideW - midW;

                  addDrawableChild(new Widgets.TextButton(x0 + W - 24, y0 + 6, 18, 14, "x", 0xFF3A1D24, this::close));

                  // categories
                  int cy = y0 + 34;
                  for (Category c : Category.values()) {
                      addDrawableChild(new Widgets.CategoryButton(x0 + 6, cy, sideW - 10, 18, c,
                              () -> query.isEmpty() && c == category,
                              () -> { category = c; query = ""; selected = null; openMode = null; needsRebuild = true; }));
                      cy += 22;
                  }

                  // search
                  boolean hadFocus = search != null && search.isFocused();
                  search = new TextFieldWidget(textRenderer, midX + 10, y0 + 25, midW - 20, 12, Text.literal("Search"));
                  search.setDrawsBackground(false);
                  search.setMaxLength(24);
                  search.setPlaceholder(Text.literal("Search modules..."));
                  search.setText(query);
                  search.setChangedListener(s -> {
                      if (!s.equals(query)) { query = s; selected = null; openMode = null; needsRebuild = true; }
                  });
                  addDrawableChild(search);
                  if (hadFocus) setFocused(search);

                  // module list
                  List<ClientModule> list = visible();
                  if (selected == null || !list.contains(selected)) selected = list.isEmpty() ? null : list.get(0);
                  int rowH = 20, gap = 3, listY = y0 + 46;
                  int maxRows = Math.max(1, (y0 + H - 14 - listY) / (rowH + gap));
                  hidden = Math.max(0, list.size() - maxRows);
                  for (int i = 0; i < Math.min(list.size(), maxRows); i++) {
                      ClientModule m = list.get(i);
                      int ry = listY + i * (rowH + gap);
                      int rx = midX + 6, rw = midW - 12;
                      addDrawableChild(new Widgets.SwitchHit(rx + rw - 30, ry, 28, rowH, m));
                      addDrawableChild(new Widgets.ModuleRow(rx, ry, rw, rowH, m, () -> selected == m,
                              () -> { selected = m; openMode = null; needsRebuild = true; }));
                  }

                  // settings panel
                  if (selected != null) {
                      final ClientModule sel = selected;
                      int sx = setX + 8, sw = setW - 16, sy = y0 + 40, limit = y0 + H - 8;
                      addDrawableChild(new Widgets.BindRow(sx, sy, sw, 18, sel, () -> listening == sel,
                              () -> { listening = sel; listenFrames = 0; }));
                      sy += 22;
                      for (Setting s : sel.settings) {
                          if (sy > limit - 18) break;
                          if (s instanceof BoolSetting b) {
                              addDrawableChild(new Widgets.BoolRow(sx, sy, sw, 18, b));
                              sy += 22;
                          } else if (s instanceof NumberSetting n) {
                              addDrawableChild(new Widgets.SliderRow(sx, sy, sw, 22, n));
                              sy += 26;
                          } else if (s instanceof ModeSetting md) {
                              addDrawableChild(new Widgets.ModeRow(sx, sy, sw, 18, md, () -> openMode == md,
                                      () -> { openMode = openMode == md ? null : md; needsRebuild = true; }));
                              sy += 22;
                              if (openMode == md) {
                                  for (int i = 0; i < md.options.length; i++) {
                                      final int idx = i;
                                      addDrawableChild(new Widgets.OptionRow(sx + 8, sy, sw - 16, 14, md, idx,
                                              () -> { md.set(idx); openMode = null; needsRebuild = true; }));
                                      sy += 16;
                                  }
                                  sy += 4;
                              }
                          }
                      }
                  }
              }

              private void pollKeys() {
                  long h = Mc.window();
                  int closeCode = KeyBindingHelper.getBoundKeyOf(PrestigeClient.menuKey).getCode();
                  boolean down = GLFW.glfwGetKey(h, closeCode) == GLFW.GLFW_PRESS;
                  if (firstPoll) { prevClose = down; firstPoll = false; }
                  else if (down && !prevClose && listening == null && !(search != null && search.isFocused())) { close(); return; }
                  prevClose = down;

                  if (listening != null) {
                      listenFrames++;
                      if (listenFrames > 8) {
                          for (int k = 32; k <= 348; k++) {
                              if (k == closeCode || GLFW.glfwGetKey(h, k) != GLFW.GLFW_PRESS) continue;
                              listening.key = (k == 259 || k == 261) ? -1 : k;  // Backspace / Delete clears
                              ConfigManager.dirty();
                              listening = null;
                              break;
                          }
                      }
                  }
              }

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  if (needsRebuild) { needsRebuild = false; clearAndInit(); }
                  Anim.open = Anim.approach(Anim.open, 1f, 14f);
                  float a = Anim.open;
                  pollKeys();

                  ctx.fill(0, 0, width, height, Gfx.alpha(0xAA000000, a));
                  Gfx.round(ctx, x0, y0, W, H, 7, Gfx.alpha(Theme.BG, a));
                  Gfx.round(ctx, x0 + 3, y0 + 3, sideW - 3, H - 6, 5, Gfx.alpha(Theme.PANEL, a));
                  Gfx.gradientText(ctx, "PRESTIGE", x0 + 9, y0 + 12, a);

                  // search box
                  Gfx.round(ctx, midX + 6, y0 + 21, midW - 12, 20, 4, Gfx.alpha(Theme.CARD, a));

                  // divider between list and settings
                  ctx.fill(setX, y0 + 8, setX + 1, y0 + H - 8, Gfx.alpha(0xFF23232F, a));

                  // settings header
                  if (selected != null) {
                      Gfx.text(ctx, selected.name, setX + 10, y0 + 10, Gfx.alpha(Theme.TEXT, a));
                      String d = Mc.tr().trimToWidth(selected.description, setW - 20);
                      Gfx.text(ctx, d, setX + 10, y0 + 22, Gfx.alpha(Theme.MUTED, a));
                  }
                  if (hidden > 0) {
                      Gfx.text(ctx, "+" + hidden + " more (search)", midX + 10, y0 + H - 12, Gfx.alpha(Theme.MUTED, a));
                  } else {
                      Gfx.text(ctx, "Combat = read-only trainers", x0 + 7, y0 + H - 13, Gfx.alpha(0xFF5C5C70, a));
                  }

                  super.render(ctx, mouseX, mouseY, delta);
              }

              // No vanilla blur: keeps the GUI cheap on phones.
              @Override
              public void renderBackground(DrawContext ctx, int mouseX, int mouseY, float delta) {}

              @Override
              public boolean shouldPause() { return false; }

              @Override
              public void close() {
                  ConfigManager.saveNow();
                  client.setScreen(parent);
              }
          }
