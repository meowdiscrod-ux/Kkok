                      card(ctx, getX(), getY(), getWidth(), getHeight(), hv, 0f);
                      Gfx.text(ctx, s.name, getX() + 8, ty(getY(), getHeight()), a(Theme.TEXT));
                      Gfx.toggle(ctx, getX() + getWidth() - 30, getY() + (getHeight() - 12) / 2, sv, Anim.open);
