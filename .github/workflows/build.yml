              public static class SliderRow extends SliderWidget {
                  private final NumberSetting s;
                  private float disp, hv;

                  public SliderRow(int x, int y, int w, int h, NumberSetting s) {
                      super(x, y, w, h, Text.empty(), s.normalized());
                      this.s = s;
                      this.disp = (float) s.normalized();
                      updateMessage();
                  }

                  @Override
                  protected void updateMessage() {
                      if (s == null) return;
                      setMessage(Text.literal(s.name + ": " + s.format()));
                  }

                  @Override
                  protected void applyValue() { s.setNormalized(this.value); }

                  @Override
                  public void renderWidget(DrawContext ctx, int mx, int my, float d) {
                      hv = Anim.approach(hv, isHovered() ? 1f : 0f, 16f);
                      disp = Anim.approach(disp, (float) this.value, 22f);
                      int x = getX(), y = getY(), w = getWidth(), h = getHeight();
