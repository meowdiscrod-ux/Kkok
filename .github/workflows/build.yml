          package prestige.modules.combat;

          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.item.Items;
          import prestige.core.*;
          import prestige.util.FallTracker;

          import java.util.List;
          import java.util.Locale;

          /** Read-only: shows fall distance, smash bonus estimate and attack cooldown. Never attacks or switches items. */
          public class MaceComboTrainer extends ClientModule {
              private final NumberSetting minFall = add(new NumberSetting("Min Fall", 1.5, 0, 10, 0.5));
              private final BoolSetting needMace = add(new BoolSetting("Require Mace", true));

              public MaceComboTrainer() {
                  super("Mace Combo Timer", "Read-only readout: fall, smash bonus, cooldown.", Category.COMBAT);
              }

              @Override
              public void addInfo(List<Line> out) {
                  ClientPlayerEntity p = mc().player;
                  if (p == null) return;
                  boolean mace = p.getMainHandStack().isOf(Items.MACE);
                  float cd = p.getAttackCooldownProgress(0f);
                  double fall = FallTracker.fall;
                  boolean ready = (mace || !needMace.get()) && fall >= minFall.get() && cd >= 0.95f;
                  out.add(new Line("Mace Combo: " + (ready ? "READY" : "wait"), ready ? Theme.GREEN : Theme.YELLOW));
                  out.add(new Line(String.format(Locale.ROOT, "Fall %.1fm  Smash +%.1f", fall, FallTracker.smash(fall)), Theme.TEXT));
                  out.add(new Line("Cooldown " + Math.round(cd * 100) + "%", cd >= 0.95f ? Theme.GREEN : Theme.MUTED));
              }
          }
