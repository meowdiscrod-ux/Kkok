          cat > 'src/main/java/prestige/modules/combat/ReactionTrainer.java' <<'PRESTIGE_EOF'
          package prestige.modules.combat;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.LivingEntity;
          import prestige.core.*;
          import prestige.util.Targets;

          import java.util.List;

          /** Read-only: measures how fast you click after a target lands under your crosshair. It never clicks for you. */
          public class ReactionTrainer extends ClientModule {
              private LivingEntity last;
              private long detectNs;
              private boolean waiting, prevDown;
              private double lastMs = -1, bestMs = -1, sumMs;
              private int count;

              public ReactionTrainer() {
                  super("Reaction Trainer", "Read-only reaction-time stats on crosshair targets.", Category.COMBAT);
              }

              @Override
              public void onDisable() { last = null; waiting = false; }

              @Override
              public void onFrame(MinecraftClient mc) {
                  if (mc.player == null) return;
                  LivingEntity c = Targets.crosshair(mc);
                  if (c == null) { waiting = false; last = null; }
                  else if (c != last) { last = c; detectNs = System.nanoTime(); waiting = true; }

                  boolean down = mc.options.attackKey.isPressed();
                  if (down && !prevDown && waiting) {
                      double ms = (System.nanoTime() - detectNs) / 1_000_000.0;
                      lastMs = ms;
                      bestMs = bestMs < 0 ? ms : Math.min(bestMs, ms);
                      sumMs += ms; count++;
                      waiting = false;
                  }
                  prevDown = down;
              }

              @Override
              public void addInfo(List<Line> out) {
                  out.add(new Line(waiting ? "Reaction: GO" : "Reaction: idle", waiting ? Theme.GREEN : Theme.MUTED));
                  if (count > 0) {
                      out.add(new Line("Last " + Math.round(lastMs) + "ms  Best " + Math.round(bestMs) + "ms", Theme.TEXT));
                      out.add(new Line("Avg " + Math.round(sumMs / count) + "ms (" + count + ")", Theme.MUTED));
                  }
              }
          }
