          cat > 'src/main/java/prestige/util/ClickTracker.java' <<'PRESTIGE_EOF'
          package prestige.util;

          import net.minecraft.client.MinecraftClient;

          import java.util.ArrayDeque;

          /** Per-frame click edge detection, used by CPS and Keystrokes. Bounded: old clicks are pruned every frame. */
          public final class ClickTracker {
              private ClickTracker() {}
              private static final ArrayDeque<Long> L = new ArrayDeque<>();
              private static final ArrayDeque<Long> R = new ArrayDeque<>();
              private static boolean pl, pr;

              public static void update(MinecraftClient mc) {
                  long now = System.currentTimeMillis();
                  boolean l = mc.options.attackKey.isPressed();
                  boolean r = mc.options.useKey.isPressed();
                  if (l && !pl) L.addLast(now);
                  if (r && !pr) R.addLast(now);
                  pl = l; pr = r;
                  while (!L.isEmpty() && now - L.peekFirst() > 1000) L.removeFirst();
                  while (!R.isEmpty() && now - R.peekFirst() > 1000) R.removeFirst();
              }

              public static int left() { return L.size(); }
              public static int right() { return R.size(); }
          }
          PRESTIGE_EOF
