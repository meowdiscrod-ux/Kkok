          public class TargetHud extends ClientModule {
              private final NumberSetting hold = add(new NumberSetting("Hold Time (s)", 2.0, 0.5, 5.0, 0.5));
              private LivingEntity target;
              private long lastSeen;
              private float shown, vis;

              public TargetHud() {
                  super("Target HUD", "Name, health, distance and armor of your target.", Category.RENDER);
              }

              @Override
              public void renderHud(DrawContext ctx, MinecraftClient mc) {
                  if (mc.player == null) return;
                  long now = System.currentTimeMillis();
                  LivingEntity c = Targets.crosshair(mc);
                  if (c != null) {
                      if (c != target) { target = c; shown = c.getHealth(); }
                      lastSeen = now;
                  }
                  boolean show = target != null && target.isAlive() && now - lastSeen < hold.get() * 1000;
                  vis = Anim.approach(vis, show ? 1f : 0f, 12f);
                  if (vis < 0.02f) { if (!show) target = null; return; }
                  if (target == null) return;

                  float hp = target.getHealth(), max = Math.max(1f, target.getMaxHealth());
                  shown = Anim.approach(shown, hp, 8f);

