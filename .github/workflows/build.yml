          package prestige.util;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;

          public final class Mc {
              private Mc() {}
              public static MinecraftClient get() { return MinecraftClient.getInstance(); }
              public static TextRenderer tr() { return MinecraftClient.getInstance().textRenderer; }
              public static long window() { return MinecraftClient.getInstance().getWindow().getHandle(); }
          }
          PRESTIGE_EOF
          mkdir -p "$(dirname 'src/main/java/prestige/util/Targets.java')"
          cat > 'src/main/java/prestige/util/Targets.java' <<'PRESTIGE_EOF'
          package prestige.util;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.decoration.ArmorStandEntity;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;

          /** Read-only target lookups for HUD and trainer modules. */
          public final class Targets {
              private Targets() {}

              public static LivingEntity crosshair(MinecraftClient mc) {
                  Entity e = mc.targetedEntity;
                  if (e instanceof LivingEntity le && le != mc.player && le.isAlive() && !(le instanceof ArmorStandEntity)) return le;
                  return null;
              }

              public static LivingEntity nearestVisible(MinecraftClient mc, double range) {
                  if (mc.world == null || mc.player == null) return null;
                  LivingEntity best = null;
                  double bd = range * range;
                  for (Entity e : mc.world.getEntities()) {
                      if (!(e instanceof LivingEntity le) || le == mc.player || !le.isAlive() || le instanceof ArmorStandEntity) continue;
                      double d = mc.player.squaredDistanceTo(le);
                      if (d < bd && mc.player.canSee(le)) { bd = d; best = le; }
                  }
                  return best;
              }

              /** Distance from the player's eyes to the closest point of the entity's hitbox. */
              public static double hitboxDistance(ClientPlayerEntity p, Entity e) {
                  Vec3d eye = p.getEyePos();
                  Box b = e.getBoundingBox();
                  double dx = eye.x - MathHelper.clamp(eye.x, b.minX, b.maxX);
                  double dy = eye.y - MathHelper.clamp(eye.y, b.minY, b.maxY);
                  double dz = eye.z - MathHelper.clamp(eye.z, b.minZ, b.maxZ);
                  return Math.sqrt(dx * dx + dy * dy + dz * dz);
              }
          }
