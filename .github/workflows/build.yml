          cat > 'src/main/java/prestige/util/FallTracker.java' <<'PRESTIGE_EOF'
          package prestige.util;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;

          /** Tracks how far the player has fallen (read-only). */
          public final class FallTracker {
              private FallTracker() {}
              public static double peakY, fall;
              public static boolean air;

              public static void tick(MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  if (p == null) { air = false; fall = 0; return; }
                  if (p.isOnGround() || p.isTouchingWater() || p.isClimbing()) {
                      air = false; fall = 0; peakY = p.getY();
                  } else {
                      if (!air) { air = true; peakY = p.getY(); }
                      if (p.getY() > peakY) peakY = p.getY();
                      fall = Math.max(0, peakY - p.getY());
                  }
              }

              /** Estimated mace smash bonus damage for a given fall distance. */
              public static double smash(double f) {
                  return Math.min(f, 3) * 4 + Math.min(Math.max(f - 3, 0), 5) * 2 + Math.max(f - 8, 0);
              }
          }
          PRESTIGE_EOF
