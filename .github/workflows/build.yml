          package prestige.modules.combat;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;
          import prestige.core.*;
          import prestige.util.Anim;
          import prestige.util.Targets;

          import java.util.List;
          import java.util.Locale;

          /**
           * Read-only aim practice stats for VISIBLE targets: shows your crosshair offset and tracking accuracy.
           * It never moves your camera, never attacks, and sends nothing to the server.
           */
          public class AimTrainer extends ClientModule {
              private final NumberSetting range = add(new NumberSetting("Range", 10, 4, 16, 1));
              private final NumberSetting sensitivity = add(new NumberSetting("Smoothing", 8, 1, 20, 1));
              private final NumberSetting tolerance = add(new NumberSetting("Tolerance (deg)", 4, 1, 15, 1));
              private boolean has;
              private float dYaw, dPitch, sYaw, sPitch, acc;
              private boolean onTarget;

              public AimTrainer() {
                  super("Aim Trainer", "Read-only aim offset and tracking accuracy.", Category.COMBAT);
              }

              @Override
              public void onFrame(MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  has = false;
                  if (p == null) return;
                  LivingEntity t = Targets.nearestVisible(mc, range.get());
                  if (t == null) return;
                  Vec3d to = t.getBoundingBox().getCenter().subtract(p.getEyePos());
                  double horiz = Math.sqrt(to.x * to.x + to.z * to.z);
                  float tYaw = (float) (Math.atan2(-to.x, to.z) * 180.0 / Math.PI);
                  float tPitch = (float) (-Math.atan2(to.y, horiz) * 180.0 / Math.PI);
                  dYaw = MathHelper.wrapDegrees(tYaw - p.getYaw());
                  dPitch = tPitch - p.getPitch();
                  float rate = (float) sensitivity.get();
                  sYaw = Anim.approach(sYaw, dYaw, rate);
                  sPitch = Anim.approach(sPitch, dPitch, rate);
                  onTarget = Math.hypot(dYaw, dPitch) <= tolerance.get();
                  acc += ((onTarget ? 1f : 0f) - acc) * 0.02f;
                  has = true;
              }

              @Override
              public void addInfo(List<Line> out) {
                  if (!has) { out.add(new Line("Aim: no visible target", Theme.MUTED)); return; }
                  out.add(new Line(onTarget ? "Aim: ON TARGET" : "Aim: off target", onTarget ? Theme.GREEN : Theme.YELLOW));
                  out.add(new Line(String.format(Locale.ROOT, "Offset %.1f / %.1f deg", sYaw, sPitch), Theme.TEXT));
                  out.add(new Line("Tracking " + Math.round(acc * 100) + "%", Theme.MUTED));
              }

              @Override
              public void renderHud(DrawContext ctx, MinecraftClient mc) {
                  if (!has) return;
                  int cx = ctx.getScaledWindowWidth() / 2, cy = ctx.getScaledWindowHeight() / 2;
                  int px = cx + Math.round(MathHelper.clamp(sYaw * 2f, -30f, 30f));
                  int py = cy + Math.round(MathHelper.clamp(sPitch * 2f, -30f, 30f));
                  ctx.fill(px - 1, py - 1, px + 2, py + 2, onTarget ? Theme.GREEN : Theme.accent());
              }
          }
