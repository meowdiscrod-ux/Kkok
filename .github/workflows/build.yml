                  private float hv;

                  public TextButton(int x, int y, int w, int h, String label, int color, Runnable press) {
                      super(x, y, w, h, Text.literal(label), b -> press.run(), DEFAULT_NARRATION_SUPPLIER);
                      this.label = label; this.color = color;
                  }

                  @Override
                  public void renderWidget(DrawContext ctx, int mx, int my, float d) {
                      hv = Anim.approach(hv, isHovered() ? 1f : 0f, 16f);
                      Gfx.round(ctx, getX(), getY(), getWidth(), getHeight(), 4, Gfx.alpha(Gfx.lerp(color, 0xFFFFFFFF, hv * 0.2f), Math.max(Anim.open, 0.0f) == 0 ? 1f : Anim.open));
                      Gfx.text(ctx, label, getX() + (getWidth() - Gfx.width(label)) / 2, ty(getY(), getHeight()), 0xFFFFFFFF);
                  }
              }

              public static class CategoryButton extends ButtonWidget {
                  private final Category c;
                  private final BooleanSupplier sel;
                  private float hv, sv;

                  public CategoryButton(int x, int y, int w, int h, Category c, BooleanSupplier sel, Runnable press) {
                      super(x, y, w, h, Text.literal(c.label), b -> press.run(), DEFAULT_NARRATION_SUPPLIER);
                      this.c = c; this.sel = sel;
                  }

                  @Override
                  public void renderWidget(DrawContext ctx, int mx, int my, float d) {
                      hv = Anim.approach(hv, isHovered() ? 1f : 0f, 16f);
                      sv = Anim.approach(sv, sel.getAsBoolean() ? 1f : 0f, 14f);
                      card(ctx, getX(), getY(), getWidth(), getHeight(), hv, sv);
                      Gfx.text(ctx, c.label, getX() + 9, ty(getY(), getHeight()), a(Gfx.lerp(Theme.MUTED, Theme.TEXT, Math.max(hv, sv))));
                  }
              }

              /** Invisible hit area over the switch. Added BEFORE the row so it receives the click first. */
              public static class SwitchHit extends ButtonWidget {
                  public SwitchHit(int x, int y, int w, int h, ClientModule m) {
                      super(x, y, w, h, Text.empty(), b -> m.toggle(), DEFAULT_NARRATION_SUPPLIER);
                  }

                  @Override
                  public void renderWidget(DrawContext ctx, int mx, int my, float d) {}
              }

              public static class ModuleRow extends ButtonWidget {
                  private final ClientModule m;
                  private final BooleanSupplier sel;
                  private float hv, sv;

                  public ModuleRow(int x, int y, int w, int h, ClientModule m, BooleanSupplier sel, Runnable press) {
                      super(x, y, w, h, Text.literal(m.name), b -> press.run(), DEFAULT_NARRATION_SUPPLIER);
                      this.m = m; this.sel = sel;
