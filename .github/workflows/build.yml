          package prestige.modules.movement;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.World;
          import prestige.core.*;
          import prestige.util.Keys;

          /** Auto-sneaks at block edges so you do not walk off. Uses the normal sneak key (no mixins). */
          public class SafeWalk extends ClientModule {
              private final NumberSetting lookahead = add(new NumberSetting("Edge Distance", 0.45, 0.2, 1.0, 0.05));
              private boolean forced;

              public SafeWalk() {
                  super("Safe Walk", "Sneaks automatically at ledges.", Category.MOVEMENT);
              }

              @Override
              public void onTick(MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  World w = mc.world;
                  if (p == null || w == null) return;
                  boolean edge = false;
                  Vec3d v = p.getVelocity();
                  double sp = Math.hypot(v.x, v.z);
                  if (p.isOnGround() && sp > 0.01) {
                      double l = lookahead.get() + sp * 2.0;
                      BlockPos b = BlockPos.ofFloored(p.getX() + v.x / sp * l, p.getY() - 0.5, p.getZ() + v.z / sp * l);
                      edge = w.getBlockState(b).getCollisionShape(w, b).isEmpty();
                  }
                  if (edge) {
                      mc.options.sneakKey.setPressed(true);
                      forced = true;
                  } else if (forced) {
                      mc.options.sneakKey.setPressed(Keys.physicallyDown(mc.options.sneakKey));
                      forced = false;
                  }
              }

              @Override
              public void onDisable() {
                  if (forced) {
                      MinecraftClient mc = mc();
                      mc.options.sneakKey.setPressed(Keys.physicallyDown(mc.options.sneakKey));
                      forced = false;
                  }
              }
          }
