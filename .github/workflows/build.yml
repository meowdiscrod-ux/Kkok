                  Gfx.text(ctx, Mc_trim(info, pw - 16), px + 8, py + 16, Gfx.alpha(Theme.MUTED, vis));

                  int bx = px + 8, by = py + ph - 9, bw = pw - 16;
                  Gfx.round(ctx, bx, by, bw, 4, 2, Gfx.alpha(Theme.OFF, vis));
                  float frac = Math.max(0f, Math.min(1f, shown / max));
                  int fw = Math.max(2, Math.round(bw * frac));
                  Gfx.round(ctx, bx, by, fw, 4, 2, Gfx.alpha(Gfx.lerp(Theme.RED_T, Theme.GREEN, frac), vis));
