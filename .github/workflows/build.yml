          package prestige.util;

          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public final class Keys {
              private Keys() {}

              public static String name(int key) {
                  if (key < 0) return "None";
                  switch (key) {
                      case 32: return "Space";
                      case 256: return "Esc";
                      case 257: return "Enter";
                      case 258: return "Tab";
                      case 259: return "Backspace";
                      case 262: return "Right";
                      case 263: return "Left";
                      case 264: return "Down";
                      case 265: return "Up";
                      case 340: return "L-Shift";
                      case 344: return "R-Shift";
                      case 341: return "L-Ctrl";
                      case 345: return "R-Ctrl";
                      case 342: return "L-Alt";
                      case 346: return "R-Alt";
                      default:
                  }
                  if (key >= 290 && key <= 301) return "F" + (key - 289);
                  if (key >= 320 && key <= 329) return "Num " + (key - 320);
                  String n = GLFW.glfwGetKeyName(key, 0);
                  if (n != null && !n.isEmpty()) return n.toUpperCase();
                  return "Key " + key;
              }

              /** True if the physical key bound to this KeyBinding is held (ignores forced state). */
              public static boolean physicallyDown(KeyBinding kb) {
                  InputUtil.Key k = KeyBindingHelper.getBoundKeyOf(kb);
                  long h = Mc.window();
                  if (k.getCategory() == InputUtil.Type.KEYSYM) return GLFW.glfwGetKey(h, k.getCode()) == GLFW.GLFW_PRESS;
                  if (k.getCategory() == InputUtil.Type.MOUSE) return GLFW.glfwGetMouseButton(h, k.getCode()) == GLFW.GLFW_PRESS;
                  return false;
              }
          }
