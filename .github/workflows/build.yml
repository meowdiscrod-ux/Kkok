          package prestige.modules.combat;

          import net.minecraft.block.BlockState;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.util.shape.VoxelShape;
          import net.minecraft.world.World;
          import prestige.core.*;
          import prestige.util.FallTracker;

          import java.util.List;
          import java.util.Locale;

          /** Read-only: estimates time to ground impact and smash bonus. Never swings or changes items. */
          public class SlamTimingAssistant extends ClientModule {
              private final NumberSetting window = add(new NumberSetting("Window (ticks)", 4, 1, 10, 1));
              private double gap = -1;
              private int ticks = -1;
              private double predictedFall;

              public SlamTimingAssistant() {
                  super("Slam Timing Assistant", "Read-only impact timer and smash estimate.", Category.COMBAT);
              }

              @Override
              public void onTick(MinecraftClient mc) {
                  gap = -1; ticks = -1;
                  ClientPlayerEntity p = mc.player;
                  World w = mc.world;
                  if (p == null || w == null || p.isOnGround()) return;

                  BlockPos.Mutable pos = new BlockPos.Mutable();
                  double top = Double.NaN;
                  for (int i = 0; i < 64; i++) {
                      pos.set(p.getX(), p.getY() - i, p.getZ());
                      BlockState st = w.getBlockState(pos);
                      VoxelShape sh = st.getCollisionShape(w, pos);
                      if (!sh.isEmpty()) {
                          double t = pos.getY() + sh.getMax(Direction.Axis.Y);
                          if (t <= p.getY() + 0.001) { top = t; break; }
                      }
                  }
                  if (Double.isNaN(top)) return;
                  gap = p.getY() - top;
                  double y = p.getY(), vy = p.getVelocity().y;
                  int t = 0;
                  while (y > top && t < 200) { y += vy; vy = (vy - 0.08) * 0.98; t++; }
                  ticks = t;
                  predictedFall = Math.max(0, FallTracker.peakY - top);
              }

              @Override
              public void addInfo(List<Line> out) {
                  if (ticks < 0) { out.add(new Line("Slam: on ground / no drop", Theme.MUTED)); return; }
                  boolean now = ticks <= window.get();
                  out.add(new Line(String.format(Locale.ROOT, "Impact ~%d ticks (%.1fm)", ticks, gap), now ? Theme.GREEN : Theme.YELLOW));
                  out.add(new Line(String.format(Locale.ROOT, "Smash at impact +%.1f", FallTracker.smash(predictedFall)), Theme.TEXT));
              }
          }
